<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="A production readiness checklist with items being ticked off">
  <defs>
    <linearGradient id="clCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131a2b"/>
      <stop offset="100%" stop-color="#0c1120"/>
    </linearGradient>
    <linearGradient id="clGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#22c3a6"/>
    </linearGradient>
    <filter id="clShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#clShadow)">
    <rect x="28" y="24" width="504" height="352" rx="18" fill="url(#clCard)"/>
    <rect x="28.5" y="24.5" width="503" height="351" rx="17.5" fill="none" stroke="#243049" stroke-width="1"/>

    <!-- title bar -->
    <circle cx="56" cy="52" r="5" fill="#ef5f5f"/>
    <circle cx="74" cy="52" r="5" fill="#f0b429"/>
    <circle cx="92" cy="52" r="5" fill="#38c172"/>
    <rect x="120" y="46" width="180" height="12" rx="6" fill="#1e2942"/>
    <line x1="28" y1="76" x2="532" y2="76" stroke="#243049" stroke-width="1"/>

    <!-- heading -->
    <rect x="56" y="100" width="238" height="14" rx="7" fill="#e8edf7"/>
    <rect x="56" y="126" width="150" height="9" rx="4.5" fill="#4a5875"/>

    <!-- progress -->
    <rect x="56" y="152" width="448" height="8" rx="4" fill="#1e2942"/>
    <rect x="56" y="152" width="290" height="8" rx="4" fill="url(#clGlow)"/>

    <!-- items -->
    <g>
      <rect x="56" y="186" width="20" height="20" rx="5" fill="#2f6fed"/>
      <path d="M61 196l4 4 7.5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="192" width="196" height="9" rx="4.5" fill="#5a6a8a"/>
    </g>
    <g>
      <rect x="56" y="226" width="20" height="20" rx="5" fill="#2f6fed"/>
      <path d="M61 236l4 4 7.5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="232" width="252" height="9" rx="4.5" fill="#5a6a8a"/>
    </g>
    <g>
      <rect x="56" y="266" width="20" height="20" rx="5" fill="#22c3a6"/>
      <path d="M61 276l4 4 7.5-8" fill="none" stroke="#0c1120" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="272" width="170" height="9" rx="4.5" fill="#5a6a8a"/>
    </g>
    <g>
      <rect x="56.9" y="306.9" width="18.2" height="18.2" rx="4.6" fill="none" stroke="#3a4763" stroke-width="1.8"/>
      <rect x="90" y="312" width="222" height="9" rx="4.5" fill="#33405c"/>
    </g>
    <g>
      <rect x="56.9" y="340.9" width="18.2" height="18.2" rx="4.6" fill="none" stroke="#3a4763" stroke-width="1.8"/>
      <rect x="90" y="346" width="140" height="9" rx="4.5" fill="#33405c"/>
    </g>
  </g>
</svg>
